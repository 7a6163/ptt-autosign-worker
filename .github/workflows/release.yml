name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract release notes from CHANGELOG
        run: |
          # The "## [x.y.z]" section up to the next heading, minus link definitions.
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md \
            | sed '/^\[.*\]: http/d' > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $GITHUB_REF_NAME"; exit 1; }
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
