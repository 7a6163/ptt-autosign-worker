name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # Codecov OIDC upload, no CODECOV_TOKEN secret needed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --coverage
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage/lcov.info
          fail_ci_if_error: true
